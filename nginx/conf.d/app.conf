# Upstream definition for Django backend
upstream django_backend {
    # Uses Docker DNS to resolve 'backend' service name
    server backend:8000;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;

    server_name kgen21.com www.kgen21.com 13.62.63.125;

    # Allow Let's Encrypt challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # Your domain
    server_name kgen21.com www.kgen21.com 13.62.63.125;

    # SSL certificate configuration
    ssl_certificate /etc/letsencrypt/live/www.kgen21.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.kgen21.com/privkey.pem;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Client body size (for file uploads)
    client_max_body_size 10M;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Root directory for React build
    root /usr/share/nginx/html;
    index index.html;

    # ============================================
    # API Proxy to Django
    # ============================================
    location /api/ {
        # Proxy to Django backend service
        proxy_pass http://django_backend;

        # Preserve original request info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Don't buffer (important for SSE/streaming)
        proxy_buffering off;
        proxy_request_buffering off;

        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ============================================
    # Django Admin
    # ============================================
    location /admin/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # Django Static Files (admin, etc.)
    # ============================================
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ============================================
    # Django Media Files
    # ============================================
    location /media/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        client_max_body_size 10M;
    }

    # ============================================
    # React App Static Assets
    # ============================================
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ============================================
    # React App - SPA Routing (catch-all)
    # ============================================
    location / {
        # Try to serve file directly, fallback to index.html
        try_files $uri $uri/ /index.html;

        # Don't cache index.html (always get latest)
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Cache other static files
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ============================================
    # Health check endpoint
    # ============================================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ============================================
    # Gzip compression
    # ============================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml application/atom+xml image/svg+xml text/javascript application/vnd.ms-fontobject application/x-font-ttf font/opentype;
}