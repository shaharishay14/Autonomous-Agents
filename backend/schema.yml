  /api/auth/token/refresh-cookie/:
    post:
      operationId: auth_token_refresh_cookie_create
      description: |-
        Refreshes the JWT access token using the refresh token from cookies.

        Flow:
        1. Reads the 'refresh' HttpOnly cookie
        2. Validates the refresh token
        3. Generates a new access token
        4. Sets the new access token in the 'access' HttpOnly cookie (24 hours expiry)
        5. Returns success message

        This is needed because access tokens expire after 24 hours, and the frontend
        needs to refresh them periodically to maintain authentication.
      tags:
      - auth
      security:
      - CookieJWTAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/connections/:
    get:
      operationId: connections_list
      description: 'Composio connections API. Security & scoping: All endpoints require
        authentication (IsAuthenticated). The request is authenticated via your configured
        auth (e.g., JWT in HttpOnly cookies). DRF authenticators verify the token,
        load the user, and set request.user. Every query is scoped with get_queryset()
        to request.user, so users can only list/retrieve/delete their own connections.'
      tags:
      - connections
      security:
      - CookieJWTAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComposioConnection'
          description: ''
    post:
      operationId: connections_create
      description: 'Starts Composio auth and upserts a local connection. **Authentication
        required.** Flow: (1) Authenticates user (returns 401 if not authenticated).
        (2) Reads tool_name from body (WhatsApp may include waba_id, phone_number_id).
        (3) Calls AgentService.authenticate_tool(tool_name, ...), which contacts Composio
        and returns auth_url and auth_config_id. (4) Upserts a local ComposioConnection
        for request.user with is_active=False and metadata.status="pending_auth".
        (5) Returns { success, auth_url, connection }. Security: Authentication enforced
        via IsAuthenticated permission. User context is always derived from the verified
        token, never from request body. Status codes: 201 if a new local record was
        created, 200 if an existing record was updated.'
      tags:
      - connections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionCreateRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConnectionCreateRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConnectionCreateRequestRequest'
        required: true
      security:
      - CookieJWTAuth: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionAuthResponse'
          description: Created and initialized auth flow
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionAuthResponse'
          description: Updated existing pending connection and returned auth URL
        '400':
          description: Validation or Composio error
        '401':
          description: Authentication credentials were not provided or are invalid
        '500':
          description: Unexpected server error
  /api/connections/{id}/:
    get:
