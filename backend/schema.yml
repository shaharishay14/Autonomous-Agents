          description: Authentication credentials were not provided or are invalid
        '404':
          description: Connection not found or not owned by user
        '500':
          description: Unexpected server error
  /api/connections/available_tools/:
    get:
      operationId: connections_available_tools
      description: "Returns all available tools that can be connected with their metadata
        and connection status. **Authentication required.** This endpoint automatically
        syncs connections from Composio API (ground truth) and returns the current
        connection status for each tool. \n\n**Behavior:**\n1. Fetches active connections
        from Composio API\n2. Updates local database with ground truth\n3. Preserves
        auth_config_id from initial OAuth flow\n4. Marks connections no longer in
        Composio as inactive\n5. Returns all available tools with is_active status
        and connection_id\n\n**Response fields:**\n- `is_active`: Boolean indicating
        if the tool is currently connected\n- `connection_id`: Database ID of the
        connection (null if not connected). Use this ID to delete the connection via
        DELETE /api/connections/{id}/\n\n**Side effects:** Writes to database (updates
        connection status)\n\n**Use case:** Call this endpoint when user visits the
        integrations page to display all available tools with real-time connection
        status. This replaces the need to call check_connections separately."
      summary: Get available tools with connection status
      tags:
      - connections
      security:
      - CookieJWTAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableToolsResponse'
              examples:
                AvailableToolsWithConnectionStatus:
                  value:
                    tools:
                    - tool_name: GMAIL
                      name: Gmail
                      description: Send, receive, and manage emails with Gmail integration
                      category: communication
                      is_active: true
                      connection_id: 42
                    - tool_name: GOOGLEDRIVE
                      name: Google Drive
                      description: Upload, download, and manage files in Google Drive
                      category: productivity
                      is_active: false
                      connection_id: null
                    - tool_name: SLACK
                      name: Slack
                      description: Send messages and manage Slack workspace communications
                      category: messaging
                      is_active: true
                      connection_id: 87
                    - tool_name: TWITTER
                      name: Twitter
                      description: Post tweets, manage followers, and interact on
                        Twitter
                      category: social
                      is_active: false
                      connection_id: null
                    count: 18
                  summary: Available Tools with Connection Status
          description: List of all available tools with metadata and connection status
        '401':
          description: Authentication credentials not provided or invalid
        '500':
          description: Unexpected server error
