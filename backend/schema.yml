components:
  schemas:
    ActionTypeEnum:
      enum:
      - message
      - tool_call
      - admin_add
      - purchase
      type: string
      description: |-
        * `message` - Chat Message
        * `tool_call` - Tool Execution
        * `admin_add` - Admin Credit Addition
        * `purchase` - Credit Purchase
    AddAgentToolRequestRequest:
      type: object
      description: Request serializer for adding an agent tool
      properties:
        tool_name:
          type: string
          minLength: 1
          description: Name of the tool to add (e.g., 'weather', 'calculator')
      required:
      - tool_name
    AddAgentToolResponse:
      type: object
      description: Response serializer for adding an agent tool
      properties:
        success:
          type: boolean
        message:
          type: string
        agent_tools:
          type: array
          items:
            type: string
      required:
      - agent_tools
      - message
      - success
    AddCreditsRequestRequest:
      type: object
      description: Request serializer for adding credits (admin only)
      properties:
        user_id:
          type: string
          format: uuid
          description: UUID of the user to add credits to
        amount:
          type: integer
          minimum: 1
          description: Number of credits to add
        description:
          type: string
          description: Optional reason for adding credits
      required:
      - amount
      - user_id
    AddCreditsResponse:
      type: object
      description: Response serializer for adding credits
      properties:
        message:
          type: string
        user_id:
          type: string
          format: uuid
        credits_added:
          type: integer
        new_balance:
          type: integer
      required:
      - credits_added
      - message
      - new_balance
      - user_id
    Agent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier for the agent
        user:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          readOnly: true
        name:
          type: string
          maxLength: 200
        prompt:
          type: string
          description: System prompt for the agent
        tools:
          readOnly: true
        app_connections:
          type: array
          items:
            type: string
            maxLength: 100
          description: List of tool names to enable for this agent (e.g., ['GMAIL',
            'SLACK'])
        agent_tools:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        message_count:
          type: integer
          readOnly: true
        avatar_base64:
          type: string
          nullable: true
          description: Base64-encoded avatar image for display (read-only)
          readOnly: true
      required:
      - agent_tools
      - avatar_base64
      - created_at
      - id
      - message_count
      - prompt
      - tools
      - updated_at
      - user
    AgentAvailableTool:
      type: object
      description: Serializer for individual tool in agent available tools response
      properties:
        tool_name:
          type: string
          description: Backend tool identifier (e.g., 'GMAIL', 'SLACK')
        name:
          type: string
          description: Display name of the tool (e.g., 'Gmail', 'Slack')
        description:
          type: string
          description: Description of what the tool does
        category:
          type: string
          description: Category classification (e.g., 'communication', 'productivity')
        is_connected_to_account:
          type: boolean
